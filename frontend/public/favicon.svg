<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Vault Folder Graphic -->
  <g filter="url(#glow)">
    <!-- Folder Back / Body -->
    <path d="M120 180 C120 162, 134 148, 152 148 L220 148 C232 148, 243 154, 250 163 L268 186 C273 192, 281 196, 289 196 L360 196 C378 196, 392 210, 392 228 L392 344 C392 362, 378 376, 360 376 L152 376 C134 376, 120 362, 120 344 Z" fill="rgba(255,255,255,0.2)" />
    
    <!-- Vault Main Body Plate -->
    <rect x="136" y="200" width="240" height="168" rx="28" fill="url(#vaultGrad)" />

    <!-- Padlock Shackle -->
    <path d="M228 260 L228 236 C228 220, 240 208, 256 208 C272 208, 284 220, 284 236 L284 260" fill="none" stroke="#6366f1" stroke-width="14" stroke-linecap="round" />

    <!-- Padlock Body -->
    <rect x="216" y="254" width="80" height="66" rx="16" fill="#4f46e5" />
    
    <!-- Keyhole -->
    <circle cx="256" cy="282" r="7" fill="#ffffff" />
    <path d="M252 284 L260 284 L263 302 L249 302 Z" fill="#ffffff" />

    <!-- Sparkle Accent Top Right -->
    <path d="M370 140 Q370 165 395 165 Q370 165 370 190 Q370 165 345 165 Q370 165 370 140 Z" fill="#38bdf8" />
    <path d="M140 370 Q140 385 155 385 Q140 385 140 400 Q140 385 125 385 Q140 385 140 370 Z" fill="#c084fc" />
  </g>
</svg>